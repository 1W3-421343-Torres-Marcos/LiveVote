server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 6s
        pool:
          type: ${GATEWAY_HTTP_POOL_TYPE:disabled}
      routes:
        - id: votes-auth
          uri: ${app.upstream.votes-url}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: votesServiceCircuitBreaker
                fallbackUri: forward:/fallback/votes
                statusCodes:
                  - "500"
                  - "502"
                  - "503"
                  - "504"
        - id: votes-polls
          uri: ${app.upstream.votes-url}
          predicates:
            - Path=/api/polls/**,/api/votes/**
          filters:
            - name: CircuitBreaker
              args:
                name: votesServiceCircuitBreaker
                fallbackUri: forward:/fallback/votes
                statusCodes:
                  - "500"
                  - "502"
                  - "503"
                  - "504"
        - id: results-stream
          uri: ${app.upstream.results-url}
          predicates:
            - Path=/api/results/*/stream
          metadata:
            response-timeout: -1
            connect-timeout: 3000
        - id: results-api
          uri: ${app.upstream.results-url}
          predicates:
            - Path=/api/results/**
          filters:
            - name: CircuitBreaker
              args:
                name: resultsServiceCircuitBreaker
                fallbackUri: forward:/fallback/results
                statusCodes:
                  - "500"
                  - "502"
                  - "503"
                  - "504"

app:
  upstream:
    votes-url: ${VOTES_SERVICE_URL:http://votes-service:8081}
    results-url: ${RESULTS_SERVICE_URL:http://results-service:8082}
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-in-production-minimum-32-bytes}
  rate-limit:
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
    vote-capacity: ${RATE_LIMIT_VOTE_CAPACITY:30}
    vote-window-seconds: ${RATE_LIMIT_VOTE_WINDOW_SECONDS:60}
    max-tracked-ips: ${RATE_LIMIT_MAX_TRACKED_IPS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        readiness:
          include: readinessState
          show-components: always
          show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
      rename:
        "[@timestamp]": timestamp
        logger_name: logger
      exclude:
        - "@version"
        - level_value
