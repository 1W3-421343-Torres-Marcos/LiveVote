server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: results-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/results_db}
    username: ${DB_USERNAME:results_user}
    password: ${DB_PASSWORD:results_dev_password}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:livevote}
    password: ${RABBITMQ_PASSWORD:livevote_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3000ms

app:
  messaging:
    retry-delay-ms: ${RETRY_DELAY_MS:5000}
    max-pending-retries: ${MAX_PENDING_RETRIES:5}
    local-retry-max-attempts: ${LOCAL_RETRY_MAX_ATTEMPTS:3}
    local-retry-initial-ms: ${LOCAL_RETRY_INITIAL_MS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
