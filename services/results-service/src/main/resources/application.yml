server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: results-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/results_db}
    username: ${DB_USERNAME:results_user}
    password: ${DB_PASSWORD:results_dev_password}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      keepalive-time: 60000
      idle-timeout: 120000
      max-lifetime: 300000
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:livevote}
    password: ${RABBITMQ_PASSWORD:livevote_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3000ms

app:
  messaging:
    retry-delay-ms: ${RETRY_DELAY_MS:5000}
    max-pending-retries: ${MAX_PENDING_RETRIES:5}
    local-retry-max-attempts: ${LOCAL_RETRY_MAX_ATTEMPTS:3}
    local-retry-initial-ms: ${LOCAL_RETRY_INITIAL_MS:500}
  sse:
    heartbeat-interval-ms: ${SSE_HEARTBEAT_INTERVAL_MS:20000}
    client-buffer-size: ${SSE_CLIENT_BUFFER_SIZE:256}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        readiness:
          include: readinessState,db,rabbit
          show-components: always
          show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
      rename:
        "[@timestamp]": timestamp
        logger_name: logger
      exclude:
        - "@version"
        - level_value
