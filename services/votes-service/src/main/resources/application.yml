server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: votes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/votes_db}
    username: ${DB_USERNAME:votes_user}
    password: ${DB_PASSWORD:votes_dev_password}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      keepalive-time: 60000
      idle-timeout: 120000
      max-lifetime: 300000
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:livevote}
    password: ${RABBITMQ_PASSWORD:livevote_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3000ms

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-in-production-minimum-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  security:
    trust-gateway-header: ${TRUST_GATEWAY_HEADER:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        readiness:
          include: readinessState,db,rabbit
          show-components: always
          show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
      rename:
        "[@timestamp]": timestamp
        logger_name: logger
      exclude:
        - "@version"
        - level_value
