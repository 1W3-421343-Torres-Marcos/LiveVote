@if (!isProjectorRoute()) {
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/polls">LiveVote</a>

      @if (authService.currentUser(); as user) {
        <nav class="nav-links" aria-label="Navegación principal">
          <a routerLink="/polls" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Mis encuestas
          </a>
          <a routerLink="/polls/new" routerLinkActive="active">Nueva encuesta</a>
        </nav>

        <div class="user-actions">
          <span class="user-email">{{ user.email }}</span>
          <button type="button" class="btn btn-secondary btn-sm" (click)="logout()">
            Cerrar sesión
          </button>
        </div>
      } @else {
        <nav class="nav-links" aria-label="Acceso">
          <a routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
          <a routerLink="/register" routerLinkActive="active">Crear cuenta</a>
        </nav>
      }
    </div>
  </header>
}

<main>
  <router-outlet />
</main>
