networks:
  livevote-internal:
    driver: bridge

volumes:
  postgres_votes_data:
  postgres_results_data:
  rabbitmq_data:

services:
  postgres-votes:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_VOTES_DB}
      POSTGRES_USER: ${POSTGRES_VOTES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_VOTES_PASSWORD}
    volumes:
      - postgres_votes_data:/var/lib/postgresql/data
    networks:
      - livevote-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-results:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_RESULTS_DB}
      POSTGRES_USER: ${POSTGRES_RESULTS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_RESULTS_PASSWORD}
    volumes:
      - postgres_results_data:/var/lib/postgresql/data
    networks:
      - livevote-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13.7-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - livevote-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  votes-service:
    build:
      context: ./services/votes-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres-votes:5432/${POSTGRES_VOTES_DB}
      DB_USERNAME: ${POSTGRES_VOTES_USER}
      DB_PASSWORD: ${POSTGRES_VOTES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS}
      TRUST_GATEWAY_HEADER: "true"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    depends_on:
      postgres-votes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - livevote-internal
    healthcheck:
      test: ["CMD", "java", "-Xmx24m", "-XX:TieredStopAtLevel=1", "-cp", "/app", "HealthCheck", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  results-service:
    build:
      context: ./services/results-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres-results:5432/${POSTGRES_RESULTS_DB}
      DB_USERNAME: ${POSTGRES_RESULTS_USER}
      DB_PASSWORD: ${POSTGRES_RESULTS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    depends_on:
      postgres-results:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - livevote-internal
    healthcheck:
      test: ["CMD", "java", "-Xmx24m", "-XX:TieredStopAtLevel=1", "-cp", "/app", "HealthCheck", "http://127.0.0.1:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      SERVER_PORT: 8080
      VOTES_SERVICE_URL: http://votes-service:8081
      RESULTS_SERVICE_URL: http://results-service:8082
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    depends_on:
      votes-service:
        condition: service_healthy
      results-service:
        condition: service_healthy
    networks:
      - livevote-internal
    healthcheck:
      test: ["CMD", "java", "-Xmx24m", "-XX:TieredStopAtLevel=1", "-cp", "/app", "HealthCheck", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - livevote-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
